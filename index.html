<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.json">
  
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#020617">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows Glass Calculator</title>

<style>

  /* ----------------------------- RESET & BASE ----------------------------- */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  /* ----------------------------- DARK THEME ----------------------------- */

  :root,
  body.theme-dark {
    --bg-1: #020617;
    --bg-2: #0f172a;
    --card: rgba(30, 41, 59, 0.72);
    --button: rgba(255, 255, 255, 0.08);
    --button-hover: rgba(255, 255, 255, 0.16);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --border: rgba(255,255,255,0.14);
  }

  /* ----------------------------- LIGHT THEME ----------------------------- */

  body.theme-light {
    --bg-1: #dbeafe;
    --bg-2: #f8fafc;
    --card: rgba(255, 255, 255, 0.78);
    --button: rgba(15, 23, 42, 0.08);
    --button-hover: rgba(15, 23, 42, 0.14);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-hover: #3b82f6;
    --border: rgba(15,23,42,0.12);
  }

  /* ----------------------------- NEON THEME ----------------------------- */

  body.theme-neon {
    --bg-1: #050014;
    --bg-2: #12002f;
    --card: rgba(20, 10, 45, 0.78);
    --button: rgba(168, 85, 247, 0.16);
    --button-hover: rgba(236, 72, 153, 0.25);
    --text: #fdf4ff;
    --muted: #c084fc;
    --accent: #ec4899;
    --accent-hover: #f472b6;
    --border: rgba(236, 72, 153, 0.28);
  }

  /* ----------------------------- WINDOWS THEME ----------------------------- */

  body.theme-windows {
    --bg-1: #0f4c81;
    --bg-2: #0078d4;
    --card: rgba(255, 255, 255, 0.18);
    --button: rgba(255, 255, 255, 0.18);
    --button-hover: rgba(255, 255, 255, 0.28);
    --text: #ffffff;
    --muted: #dbeafe;
    --accent: #0078d4;
    --accent-hover: #38bdf8;
    --border: rgba(255,255,255,0.25);
  }

  /* ----------------------------- BODY ----------------------------- */

  body {
     min-height: 100dvh;

    display: flex;
    justify-content: center;

    /* QUAN TRỌNG */
    align-items: flex-start;

    color: var(--text);

    background:
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow-x: hidden;
    overflow-y: auto;

    transition: 0.3s;

    padding: 24px 0;
  }

  /* ----------------------------- BACKGROUND ORBS ----------------------------- */

  .bg-orb {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: float 8s infinite alternate ease-in-out;
  }

  .orb-1 {
    background: #38bdf8;
    top: -120px;
    left: -120px;
  }

  .orb-2 {
    background: #a855f7;
    bottom: -130px;
    right: -130px;
    animation-delay: 1.5s;
  }

  .orb-3 {
    background: #22c55e;
    bottom: 10%;
    left: 20%;
    width: 260px;
    height: 260px;
    animation-delay: 3s;
  }

  /* ----------------------------- ANIMATIONS ----------------------------- */

  @keyframes float {
    from {
      transform: translate(0, 0) scale(1);
    }
    to {
      transform: translate(50px, -40px) scale(1.15);
    }
  }

  /* ----------------------------- MAIN APP LAYOUT ----------------------------- */

  .app {
    position: relative;
    z-index: 2;
    width: min(760px, 94vw);
    display: grid;
    grid-template-columns: 390px 1fr;
    gap: 18px;
  }

  /* ----------------------------- GLASS PANELS ----------------------------- */

  .calculator,
  .history-panel {
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-radius: 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.35);
  }

  /* ----------------------------- CALCULATOR ----------------------------- */

  .calculator {
    padding: 18px;
  }

  /* ----------------------------- TOPBAR ----------------------------- */

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  /* ----------------------------- ACTION BUTTONS ----------------------------- */

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--button);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
  }

  /* ----------------------------- THEME SELECT ----------------------------- */

  .theme-select {
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--button);
    color: var(--text);
    padding: 0 10px;
    outline: none;
    cursor: pointer;
  }

  .theme-select option {
    color: #111827;
  }

  /* ----------------------------- SCREEN DISPLAY ----------------------------- */

  .screen {
    min-height: 120px;
    padding: 8px 6px 16px;
    text-align: right;
    overflow: hidden;
  }
  

  .history-line {
    height: 24px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display {
    font-size: 52px;
    font-weight: 600;
    word-break: break-all;
  }

  /* ----------------------------- BUTTON GRID ----------------------------- */

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    height: 60px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--button);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    transition: 0.12s ease;
    user-select: none;
  }

  /* ----------------------------- BUTTON STATES ----------------------------- */

  button:hover {
    background: var(--button-hover);
    transform: translateY(-1px);
  }

  button:active {
    transform: scale(0.96);
  }

  .operator {
    font-weight: 600;
  }

  .equal {
    background: var(--accent);
    color: white;
    font-weight: 800;
  }

  .equal:hover {
    background: var(--accent-hover);
  }

  /* ----------------------------- HISTORY PANEL ----------------------------- */

  .history-panel {
    padding: 18px;
    max-height: 610px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .history-title {
    font-size: 17px;
    font-weight: 700;
  }

  .clear-history {
    height: 34px;
    padding: 0 12px;
    font-size: 13px;
    border-radius: 10px;
  }

  .history-list {
    overflow-y: auto;
    padding-right: 4px;
  }

  /* ----------------------------- HISTORY ITEMS ----------------------------- */

  .history-item {
    padding: 12px;
    border-radius: 14px;
    background: var(--button);
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .history-item:hover {
    background: var(--button-hover);
  }

  .expression {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 5px;
  }

  .result {
    font-size: 20px;
    font-weight: 700;
    text-align: right;
  }

  .empty {
    color: var(--muted);
    font-size: 14px;
    margin-top: 20px;
    text-align: center;
  }

  /* ----------------------------- TOAST ----------------------------- */

  .toast {
    position: fixed;
    z-index: 5;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.9);
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
  }

  .toast.show {
    opacity: 1;
    bottom: 40px;
  }

  /* ----------------------------- CREDIT ----------------------------- */

  .credit {
    position: fixed;
    z-index: 3;
    bottom: 12px;
    right: 16px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ----------------------------- CUSTOM SELECT ----------------------------- */

  .custom-select-wrapper {
    position: relative;
    width: 150px;
    font-size: 14px;
  }

  .custom-select {
    position: relative;
    background: var(--button);
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }

  .custom-select .selected {
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .custom-select .selected::after {
    content: "▾";
    margin-left: 8px;
    font-size: 12px;
  }

  .custom-select .options {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: none;
    z-index: 10;
    margin-top: 4px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  }

  .custom-select .option {
    padding: 8px 12px;
    cursor: pointer;
    transition: 0.12s;
  }

  .custom-select .option:hover {
    background: var(--button-hover);
  }

  .custom-select .option.selected {
    font-weight: 600;
  }

  .custom-select.open .options {
    display: block;
  }

  /* ----------------------------- RESPONSIVE 820PX ----------------------------- */

 @media (max-width: 820px) {
    body {
      min-height: 100dvh;
      padding: 18px 12px 40px;
    }

    .app {
      width: 100%;
      grid-template-columns: 1fr;
    }

    .calculator,
    .history-panel {
      width: 100%;
    }

    .history-panel {
      max-height: 260px;
    }
  }

  /* ----------------------------- RESPONSIVE 430PX ----------------------------- */

  @media (max-width: 430px) {
    .display {
      font-size: 44px;
    }

    button {
      height: 56px;
    }

    .calculator {
      padding: 14px;
    }
  }

  /* ----------------------------- CURRENCY CONVERTER ----------------------------- */

  .hidden {
    display: none;
  }

  .currency-box {
    margin-bottom: 14px;
    padding: 14px;
    border-radius: 18px;
    background: var(--button);
    border: 1px solid var(--border);
    animation: fadeIn 0.2s ease;
  }

  .currency-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .currency-row select {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 0 10px;
    outline: none;
    font-size: 15px;
  }

  .currency-arrow {
    font-size: 20px;
    font-weight: bold;
  }

  .convert-btn {
    width: 100%;
    margin-top: 12px;
    height: 46px;
    border-radius: 14px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }

  .convert-btn:hover {
    background: var(--accent-hover);
  }

  .currency-result {
    margin-top: 12px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-hover);
  }

  /* ===================== UTILS MENU ===================== */

  .utils-menu {
    position: relative;
  }

  .utils-dropdown {
    position: absolute;
    top: 48px;
    right: 0;

    width: 220px;

    background: var(--card);
    border: 1px solid var(--border);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-radius: 16px;

    overflow: hidden;

    display: none;

    z-index: 999;

    box-shadow: 0 10px 30px rgba(0,0,0,0.35);

    animation: dropFade 0.15s ease;
  }

  .utils-dropdown.show {
    display: block;
  }

  .utils-item {
    padding: 12px 14px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    transition: 0.15s;
  }

  .utils-item:hover {
    background: var(--button-hover);
  }

  /* fix error layout in mobie */
  .actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

  @media (max-width: 430px) {
  .actions {
    gap: 6px;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    font-size: 14px;
  }
}

  .utils-dropdown {
  border-radius: 18px;
  overflow: hidden;
}

.bg-menu {
  position: fixed;
  z-index: 9999;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 180px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  overflow: hidden;
}

.bg-menu.hidden {
  display: none;
}

.bg-menu-item {
  padding: 12px;
  cursor: pointer;
  font-size: 14px;
}

.bg-menu-item:hover {
  background: var(--button-hover);
}

.bg-menu-item.danger {
  color: #ff4d4d;
}

/* animation nhẹ cho dropdown */
@keyframes dropFade {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>

</head>
<!-- ----------------------------- BACKGROUND ORBS ----------------------------- -->
<body class="theme-dark">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

<!-- ----------------------------- MAIN APP ----------------------------- -->
  <main class="app">
    <section class="calculator">
      <!-- ----------------------------- TOPBAR ----------------------------- -->
      <div class="topbar">
        <div class="title">Calculator</div>
        <!-- ----------------------------- ACTIONS ----------------------------- -->
        <div class="actions">

          <!-- ===================== UTILS MENU ===================== -->

          <div class="utils-menu" id="utilsMenu">

            <button class="icon-btn" onclick="toggleUtilsMenu()">
              ☰
            </button>

            <div class="utils-dropdown" id="utilsDropdown">

              <div class="utils-item" onclick="toggleCurrencyBox()">
                💱 Currency Converter
              </div>

              <div 
                class="utils-item"
                onclick="document.getElementById('bgUpload').click()"
              >
                🖼 Change Background
              </div>

            </div>

          </div>

          <!-- ===================== COPY ===================== -->

          <button 
            class="icon-btn" 
            onclick="copyResult()" 
            title="Copy result"
          >
            ⧉
          </button>

          <!-- ===================== THEME ===================== -->

          <div class="custom-select-wrapper">

            <div class="custom-select" id="themeSelect">

              <div class="selected">Dark Glass</div>

              <div class="options">

                <div data-value="theme-dark" class="option selected">
                  Dark Glass
                </div>

                <div data-value="theme-light" class="option">
                  Light
                </div>

                <div data-value="theme-neon" class="option">
                  Neon
                </div>

                <div data-value="theme-windows" class="option">
                  Windows Blue
                </div>

              </div>

            </div>

          </div>

        </div>

        <!-- hidden upload -->

        <input 
          type="file" 
          id="bgUpload" 
          accept="image/*" 
          hidden
          onchange="changeBackground(event)"
        >
      </div>
      
      <div class="screen">
        <div class="history-line" id="historyLine"></div>
        <div class="display" id="display">0</div>
      </div>

      <!-- ----------------------------- CURRENCY CONVERTER ----------------------------- -->

      <div class="currency-box hidden" id="currencyBox">
        <div class="currency-row">
          
          <select id="fromCurrency">
            <option>VND</option>
            <option>USD</option>
            <option>EUR</option>
            <option>JPY</option>
            <option>GBP</option>
            <option>CNY</option>
            <option>INR</option>
          </select>

          <span class="currency-arrow">→</span>

          <select id="toCurrency">
            <option>USD</option>
            <option selected>VND</option>
            <option>EUR</option>
            <option>JPY</option>
            <option>GBP</option>
            <option>CNY</option>
            <option>INR</option>
          </select>

        </div>

        <button class="convert-btn" onclick="convertCurrency()">
          Convert Currency
        </button>

        <div class="currency-result" id="currencyResult">
          --
        </div>
      </div>

      <div class="buttons">
        <button class="operator" onclick="percent()">%</button>
        <button class="operator" onclick="clearEntry()">CE</button>
        <button class="operator" onclick="clearAll()">C</button>
        <button class="operator" onclick="backspace()">⌫</button>

        <button class="operator" onclick="reciprocal()">1/x</button>
        <button class="operator" onclick="square()">x²</button>
        <button class="operator" onclick="sqrt()">√x</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="toggleSign()">±</button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendDot()">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </section>

    <!-- ----------------------------- HISTORY PANEL ----------------------------- -->
    <aside class="history-panel">
      <div class="history-head">
        <div class="history-title">History</div>
        <button class="clear-history" onclick="clearHistory()">Clear</button>
      </div>

      <div class="history-list" id="historyList">
        <div class="empty">Chưa có phép tính nào</div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast">Copied result</div>
  <div class="credit">Made by Pham Quoc Tien</div>

  <script>
    const display = document.getElementById("display");
    const historyLine = document.getElementById("historyLine");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");

    let currentInput = "0";
    let previousInput = null;
    let operator = null;
    let shouldResetScreen = false;
    let historyData = [];

    function updateDisplay() {
      display.textContent = formatNumber(currentInput);
    }

    function showBgMenu(x, y) {
    const menu = document.getElementById("bgMenu");

    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.classList.remove("hidden");
  }

    function hideBgMenu() {
    document.getElementById("bgMenu").classList.add("hidden");
  }

    document.addEventListener("click", (e) => {

      const menu = document.getElementById("bgMenu");

      // nếu click trong menu thì không hide
      if (menu.contains(e.target)) return;

      // nếu vừa hold mở menu thì bỏ qua click đầu tiên
      if (isMenuOpenedByHold) {
        isMenuOpenedByHold = false;
        return;
      }

      hideBgMenu();

    });

    /* ----------------------------- CURRENCY CONVERTER ----------------------------- */

    function toggleCurrencyBox() {

      const box = document.getElementById("currencyBox");

      box.classList.toggle("hidden");

    }

    async function convertCurrency() {

      const from = document.getElementById("fromCurrency").value;
      const to = document.getElementById("toCurrency").value;
      const resultDiv = document.getElementById("currencyResult");

      const amount = Number(currentInput);

      if (isNaN(amount)) {
        resultDiv.textContent = "Invalid number";
        return;
      }

      resultDiv.textContent = "Loading...";

      try {

        const response = await fetch(
          `https://open.er-api.com/v6/latest/${from}`
        );

        const data = await response.json();

        if (!data.rates || !data.rates[to]) {
          resultDiv.textContent = "Currency error";
          return;
        }

        const rate = data.rates[to];

        const converted = amount * rate;

        resultDiv.innerHTML = `
          ${formatCurrency(amount, from)}
          <br>
          =
          <br>
          ${formatCurrency(converted, to)}
        `;

      } catch (err) {

        resultDiv.textContent = "No internet connection";

      }

    }

    function formatCurrency(value, currency) {

      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: currency,
        maximumFractionDigits: 2
      }).format(value);

    }

    function formatNumber(value) {
      if (value === "Error") return value;

      const num = Number(value);
      if (Number.isNaN(num)) return value;

      if (Math.abs(num) >= 1000000000000) {
        return num.toExponential(6);
      }

      return value.toString();
    }

    function cleanResult(num) {
      return parseFloat(Number(num).toFixed(10)).toString();
    }

    function appendNumber(num) {
      if (currentInput === "Error" || currentInput === "0" || shouldResetScreen) {
        currentInput = num;
        shouldResetScreen = false;
      } else {
        currentInput += num;
      }

      updateDisplay();
    }

    function appendDot() {
      if (currentInput === "Error" || shouldResetScreen) {
        currentInput = "0";
        shouldResetScreen = false;
      }

      if (!currentInput.includes(".")) {
        currentInput += ".";
      }

      updateDisplay();
    }

    function chooseOperator(op) {
      if (operator !== null && !shouldResetScreen) {
        calculate();
      }

      previousInput = currentInput;
      operator = op;
      shouldResetScreen = true;

      historyLine.textContent = `${formatNumber(previousInput)} ${convertOperator(op)}`;
    }

    function calculate() {
      if (operator === null || shouldResetScreen) return;

      const prev = Number(previousInput);
      const current = Number(currentInput);
      let result;

      if (operator === "+") result = prev + current;
      if (operator === "-") result = prev - current;
      if (operator === "*") result = prev * current;
      if (operator === "/") result = current === 0 ? "Error" : prev / current;

      const expression = `${formatNumber(previousInput)} ${convertOperator(operator)} ${formatNumber(currentInput)} =`;

      currentInput = result === "Error" ? "Error" : cleanResult(result);
      historyLine.textContent = expression;

      addHistory(expression, currentInput);

      operator = null;
      previousInput = null;
      shouldResetScreen = true;

      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = null;
      operator = null;
      shouldResetScreen = false;
      historyLine.textContent = "";
      updateDisplay();
    }

    function clearEntry() {
      currentInput = "0";
      updateDisplay();
    }

    function backspace() {
      if (currentInput === "Error" || shouldResetScreen) {
        currentInput = "0";
        shouldResetScreen = false;
      } else {
        currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
      }

      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === "0" || currentInput === "Error") return;

      currentInput = currentInput.startsWith("-")
        ? currentInput.slice(1)
        : "-" + currentInput;

      updateDisplay();
    }

    function percent() {
      if (currentInput === "Error") return;

      historyLine.textContent = `${currentInput}%`;
      currentInput = cleanResult(Number(currentInput) / 100);
      shouldResetScreen = true;
      updateDisplay();
    }

    function square() {
      if (currentInput === "Error") return;

      const expression = `sqr(${formatNumber(currentInput)})`;
      currentInput = cleanResult(Number(currentInput) * Number(currentInput));

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function sqrt() {
      if (currentInput === "Error") return;

      const num = Number(currentInput);
      const expression = `√(${formatNumber(currentInput)})`;

      if (num < 0) {
        currentInput = "Error";
      } else {
        currentInput = cleanResult(Math.sqrt(num));
      }

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function reciprocal() {
      if (currentInput === "Error") return;

      const num = Number(currentInput);
      const expression = `1/(${formatNumber(currentInput)})`;

      currentInput = num === 0 ? "Error" : cleanResult(1 / num);

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function convertOperator(op) {
      if (op === "*") return "×";
      if (op === "/") return "÷";
      if (op === "-") return "−";
      return op;
    }

    function addHistory(expression, result) {
      historyData.unshift({ expression, result });
      if (historyData.length > 20) historyData.pop();
      renderHistory();
    }

    function renderHistory() {
      if (historyData.length === 0) {
        historyList.innerHTML = `<div class="empty">Chưa có phép tính nào</div>`;
        return;
      }

      historyList.innerHTML = "";

      historyData.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="expression">${item.expression}</div>
          <div class="result">${item.result}</div>
        `;

        div.onclick = () => {
          currentInput = item.result;
          shouldResetScreen = true;
          updateDisplay();
        };

        historyList.appendChild(div);
      });
    }

    function clearHistory() {
      historyData = [];
      renderHistory();
    }

    function copyResult() {
      navigator.clipboard.writeText(currentInput);
      showToast("Copied result");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 1300);
    }

    function triggerChangeBg() {
      hideBgMenu();
      document.getElementById("bgUpload").click();
    }

    function confirmRemoveBg() {
      hideBgMenu();

      localStorage.removeItem("calculator-bg");

      applyThemeBackground();

      showToast("Background Removed");
    }

    function applyThemeBackground() {

    document.body.style.background = `
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
      linear-gradient(135deg, var(--bg-1), var(--bg-2))
    `;

    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
  }

    /* ----------------------------- BACKGROUND IMAGE ----------------------------- */

    function changeBackground(event) {

      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {

        const image = e.target.result;

        document.body.style.background = `
          linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
          url(${image}) center/cover no-repeat
        `;

        localStorage.setItem("calculator-bg", image);

        showToast("Background Updated");

      };

      reader.readAsDataURL(file);

    }

function loadBackground() {
   const savedBg = localStorage.getItem("calculator-bg");

  if (!savedBg) {

    applyThemeBackground();
    return;

  }

  document.body.style.background = `
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url(${savedBg}) center/cover no-repeat
  `;

}

    const themeSelect = document.getElementById("themeSelect");

    function changeTheme(theme) {
        document.body.className = theme;

      localStorage.setItem("calculator-theme", theme);

      const savedBg = localStorage.getItem("calculator-bg");

      if (!savedBg) {
        applyThemeBackground();
      }
    }

    function loadTheme() {
  const savedTheme = localStorage.getItem("calculator-theme") || "theme-dark";
  document.body.className = savedTheme;
}

    loadTheme();

    loadBackground();

    const customSelect = document.getElementById("themeSelect");
    const selectedDiv = customSelect.querySelector(".selected");
    const optionsDiv = customSelect.querySelector(".options");
    const options = optionsDiv.querySelectorAll(".option");

    options.forEach(option => {
      if (option.getAttribute("data-value") === document.body.className) {
        selectedDiv.textContent = option.textContent;
        option.classList.add("selected");
      }
    });

    selectedDiv.addEventListener("click", () => {
      customSelect.classList.toggle("open");
    });

    options.forEach(option => {
      option.addEventListener("click", () => {
        selectedDiv.textContent = option.textContent;

        options.forEach(o => o.classList.remove("selected"));
        option.classList.add("selected");

        changeTheme(option.getAttribute("data-value"));

        customSelect.classList.remove("open");
      });
    });

    document.addEventListener("click", e => {
      if (!customSelect.contains(e.target)) {
        customSelect.classList.remove("open");
      }
    });

    document.addEventListener("keydown", function(e) {
      if (!Number.isNaN(Number(e.key))) appendNumber(e.key);
      if (e.key === ".") appendDot();
      if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
      if (e.key === "Enter" || e.key === "=") calculate();
      if (e.key === "Backspace") backspace();
      if (e.key === "Escape") clearAll();
      if (e.key === "%") percent();
    });
    /* ===================== UTILS MENU ===================== */

    const utilsDropdown = document.getElementById("utilsDropdown");

    function toggleUtilsMenu() {

      utilsDropdown.classList.toggle("show");

    }

    let pressTimer = null;
    let pressStart = false;

    function startPress(e) {
       // không hold trên button
      if (e.target.closest("button")) return;

      isMenuOpenedByHold = false;

      const x = e.pageX || e.touches?.[0]?.pageX;
      const y = e.pageY || e.touches?.[0]?.pageY;

      pressTimer = setTimeout(() => {

        showBgMenu(x, y);

        // đánh dấu menu mở bởi hold
        isMenuOpenedByHold = true;

      }, 500);
    }

    function cancelPress() {
      // pressStart = false;
      clearTimeout(pressTimer);
    }

    /* mouse */
    document.body.addEventListener("mousedown", startPress);
    document.body.addEventListener("mouseup", cancelPress);
    document.body.addEventListener("mouseleave", cancelPress);

    /* touch (QUAN TRỌNG) */
    document.body.addEventListener("touchstart", startPress, { passive: true });
    document.body.addEventListener("touchend", cancelPress);
    document.body.addEventListener("touchcancel", cancelPress);
        
    updateDisplay();

  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker error:", err));
    });
  }
</script>
<div class="bg-menu hidden" id="bgMenu">
  <div class="bg-menu-item" onclick="triggerChangeBg()">
    🖼 Change Background
  </div>

  <div class="bg-menu-item danger" onclick="confirmRemoveBg()">
    🗑 Remove Background
  </div>
</div>
</body>
</html>
