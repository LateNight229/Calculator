<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#020617">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows Glass Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    :root {
      --bg-1: #020617;
      --bg-2: #0f172a;
      --card: rgba(30, 41, 59, 0.72);
      --button: rgba(255, 255, 255, 0.08);
      --button-hover: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --border: rgba(255,255,255,0.14);
    }

    body.light {
      --bg-1: #dbeafe;
      --bg-2: #f8fafc;
      --card: rgba(255, 255, 255, 0.72);
      --button: rgba(15, 23, 42, 0.08);
      --button-hover: rgba(15, 23, 42, 0.14);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --border: rgba(15,23,42,0.12);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
      transition: 0.3s;
    }

    .bg-orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: float 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      background: #38bdf8;
      top: -120px;
      left: -120px;
    }

    .orb-2 {
      background: #a855f7;
      bottom: -130px;
      right: -130px;
      animation-delay: 1.5s;
    }

    .orb-3 {
      background: #22c55e;
      bottom: 10%;
      left: 20%;
      width: 260px;
      height: 260px;
      animation-delay: 3s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(50px, -40px) scale(1.15);
      }
    }

    .app {
      position: relative;
      z-index: 2;
      width: 760px;
      max-width: 94vw;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 18px;
    }

    .calculator,
    .history-panel {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    .calculator {
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
    }

    .screen {
      min-height: 120px;
      padding: 8px 6px 16px;
      text-align: right;
      overflow: hidden;
    }

    .history-line {
      height: 24px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display {
      font-size: 52px;
      font-weight: 600;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 60px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--button);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      transition: 0.12s ease;
      user-select: none;
    }

    button:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.96);
    }

    .operator {
      font-weight: 600;
    }

    .equal {
      background: var(--accent);
      color: white;
      font-weight: 800;
    }

    .equal:hover {
      background: var(--accent-hover);
    }

    .history-panel {
      padding: 18px;
      max-height: 610px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .history-title {
      font-size: 17px;
      font-weight: 700;
    }

    .clear-history {
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .history-list {
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      padding: 12px;
      border-radius: 14px;
      background: var(--button);
      margin-bottom: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .history-item:hover {
      background: var(--button-hover);
    }

    .expression {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .result {
      font-size: 20px;
      font-weight: 700;
      text-align: right;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      margin-top: 20px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 5;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }

    .toast.show {
      opacity: 1;
      bottom: 40px;
    }

    .credit {
      position: fixed;
      z-index: 3;
      bottom: 12px;
      right: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      body {
        overflow-y: auto;
        padding: 28px 0;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .history-panel {
        max-height: 260px;
      }
    }

    @media (max-width: 430px) {
      .display {
        font-size: 44px;
      }

      button {
        height: 56px;
      }

      .calculator {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="app">
    <section class="calculator">
      <div class="topbar">
        <div class="title">Calculator</div>
        <div class="actions">
          <button class="icon-btn" onclick="copyResult()" title="Copy result">⧉</button>
          <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
        </div>
      </div>

      <div class="screen">
        <div class="history-line" id="historyLine"></div>
        <div class="display" id="display">0</div>
      </div>

      <div class="buttons">
        <button class="operator" onclick="percent()">%</button>
        <button class="operator" onclick="clearEntry()">CE</button>
        <button class="operator" onclick="clearAll()">C</button>
        <button class="operator" onclick="backspace()">⌫</button>

        <button class="operator" onclick="reciprocal()">1/x</button>
        <button class="operator" onclick="square()">x²</button>
        <button class="operator" onclick="sqrt()">√x</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="toggleSign()">±</button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendDot()">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </section>

    <aside class="history-panel">
      <div class="history-head">
        <div class="history-title">History</div>
        <button class="clear-history" onclick="clearHistory()">Clear</button>
      </div>

      <div class="history-list" id="historyList">
        <div class="empty">Chưa có phép tính nào</div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast">Copied result</div>
  <div class="credit">Made by Pham Quoc Tien</div>

  <script>
    const display = document.getElementById("display");
    const historyLine = document.getElementById("historyLine");
    const historyList = document.getElementById("historyList");
    const toast = document.getElementById("toast");

    let currentInput = "0";
    let previousInput = null;
    let operator = null;
    let shouldResetScreen = false;
    let historyData = [];

    function updateDisplay() {
      display.textContent = formatNumber(currentInput);
    }

    function formatNumber(value) {
      if (value === "Error") return value;

      const num = Number(value);
      if (Number.isNaN(num)) return value;

      if (Math.abs(num) >= 1000000000000) {
        return num.toExponential(6);
      }

      return value.toString();
    }

    function cleanResult(num) {
      return parseFloat(Number(num).toFixed(10)).toString();
    }

    function appendNumber(num) {
      if (currentInput === "Error" || currentInput === "0" || shouldResetScreen) {
        currentInput = num;
        shouldResetScreen = false;
      } else {
        currentInput += num;
      }

      updateDisplay();
    }

    function appendDot() {
      if (currentInput === "Error" || shouldResetScreen) {
        currentInput = "0";
        shouldResetScreen = false;
      }

      if (!currentInput.includes(".")) {
        currentInput += ".";
      }

      updateDisplay();
    }

    function chooseOperator(op) {
      if (operator !== null && !shouldResetScreen) {
        calculate();
      }

      previousInput = currentInput;
      operator = op;
      shouldResetScreen = true;

      historyLine.textContent = `${formatNumber(previousInput)} ${convertOperator(op)}`;
    }

    function calculate() {
      if (operator === null || shouldResetScreen) return;

      const prev = Number(previousInput);
      const current = Number(currentInput);
      let result;

      if (operator === "+") result = prev + current;
      if (operator === "-") result = prev - current;
      if (operator === "*") result = prev * current;
      if (operator === "/") result = current === 0 ? "Error" : prev / current;

      const expression = `${formatNumber(previousInput)} ${convertOperator(operator)} ${formatNumber(currentInput)} =`;

      currentInput = result === "Error" ? "Error" : cleanResult(result);
      historyLine.textContent = expression;

      addHistory(expression, currentInput);

      operator = null;
      previousInput = null;
      shouldResetScreen = true;

      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = null;
      operator = null;
      shouldResetScreen = false;
      historyLine.textContent = "";
      updateDisplay();
    }

    function clearEntry() {
      currentInput = "0";
      updateDisplay();
    }

    function backspace() {
      if (currentInput === "Error" || shouldResetScreen) {
        currentInput = "0";
        shouldResetScreen = false;
      } else {
        currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
      }

      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === "0" || currentInput === "Error") return;

      currentInput = currentInput.startsWith("-")
        ? currentInput.slice(1)
        : "-" + currentInput;

      updateDisplay();
    }

    function percent() {
      if (currentInput === "Error") return;

      historyLine.textContent = `${currentInput}%`;
      currentInput = cleanResult(Number(currentInput) / 100);
      shouldResetScreen = true;
      updateDisplay();
    }

    function square() {
      if (currentInput === "Error") return;

      const expression = `sqr(${formatNumber(currentInput)})`;
      currentInput = cleanResult(Number(currentInput) * Number(currentInput));

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function sqrt() {
      if (currentInput === "Error") return;

      const num = Number(currentInput);
      const expression = `√(${formatNumber(currentInput)})`;

      if (num < 0) {
        currentInput = "Error";
      } else {
        currentInput = cleanResult(Math.sqrt(num));
      }

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function reciprocal() {
      if (currentInput === "Error") return;

      const num = Number(currentInput);
      const expression = `1/(${formatNumber(currentInput)})`;

      currentInput = num === 0 ? "Error" : cleanResult(1 / num);

      historyLine.textContent = expression;
      addHistory(expression, currentInput);

      shouldResetScreen = true;
      updateDisplay();
    }

    function convertOperator(op) {
      if (op === "*") return "×";
      if (op === "/") return "÷";
      if (op === "-") return "−";
      return op;
    }

    function addHistory(expression, result) {
      historyData.unshift({ expression, result });
      if (historyData.length > 20) historyData.pop();
      renderHistory();
    }

    function renderHistory() {
      if (historyData.length === 0) {
        historyList.innerHTML = `<div class="empty">Chưa có phép tính nào</div>`;
        return;
      }

      historyList.innerHTML = "";

      historyData.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="expression">${item.expression}</div>
          <div class="result">${item.result}</div>
        `;

        div.onclick = () => {
          currentInput = item.result;
          shouldResetScreen = true;
          updateDisplay();
        };

        historyList.appendChild(div);
      });
    }

    function clearHistory() {
      historyData = [];
      renderHistory();
    }

    function copyResult() {
      navigator.clipboard.writeText(currentInput);
      showToast("Copied result");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 1300);
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    document.addEventListener("keydown", function(e) {
      if (!Number.isNaN(Number(e.key))) appendNumber(e.key);
      if (e.key === ".") appendDot();
      if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
      if (e.key === "Enter" || e.key === "=") calculate();
      if (e.key === "Backspace") backspace();
      if (e.key === "Escape") clearAll();
      if (e.key === "%") percent();
    });

    updateDisplay();
  </script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.log("Service Worker error:", err));
    });
  }
</script>
</body>
</html>
